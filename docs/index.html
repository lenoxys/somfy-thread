<!DOCTYPE html>
<!-- SPDX-License-Identifier: Unlicense -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' blob: https://api.github.com https://github.com https://objects.githubusercontent.com; base-uri 'none'; form-action 'none'">
<title>somfy-thread — setup</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">somfy<span>-thread</span></span>
  <button type="button" id="theme" class="topbtn"></button>
</header>

<main>
  <ol class="stepper" id="stepper">
    <li data-i18n="step.board"></li>
    <li data-i18n="step.shades"></li>
    <li data-i18n="step.matter"></li>
    <li data-i18n="step.backup"></li>
  </ol>

  <!-- Step 0 — Board: connect, detect firmware, then update / flash / continue -->
  <section class="card step" data-step="0">
    <h2 data-i18n="board.title"></h2>
    <p class="muted" data-i18n="board.intro"></p>
    <div class="callout" data-i18n="compat.warn"></div>
    <label class="ack"><input type="checkbox" id="ack"> <span data-i18n="compat.ack"></span></label>
    <div class="bar">
      <button id="connect" class="btn primary" disabled data-i18n="board.connect"></button>
      <span class="status"><span class="dot" id="dot"></span><span id="statusText" data-i18n="status.disconnected"></span></span>
    </div>
    <p class="muted" data-i18n-html="board.portHint"></p>
    <div id="detect" class="callout" hidden></div>
    <div id="flasher" hidden>
      <div class="bar">
        <label for="release" data-i18n="flasher.versionLabel"></label>
        <select id="release"><option data-i18n="flasher.loading"></option></select>
        <button type="button" id="refreshReleases" class="iconbtn" data-icon="refresh"></button>
      </div>
      <esp-web-install-button id="installer">
        <button slot="activate" class="btn primary" data-i18n="flasher.flash"></button>
        <span slot="unsupported" class="muted" data-i18n="flasher.unsupported"></span>
        <span slot="not-allowed" class="muted" data-i18n="flasher.notAllowed"></span>
      </esp-web-install-button>
      <p class="muted" id="fallback"></p>
      <details id="changelogBox" hidden>
        <summary data-i18n="flasher.releaseNotes"></summary>
        <pre id="changelog"></pre>
      </details>
    </div>
  </section>

  <!-- Step 1 — Shades (one shade = one Somfy motor) -->
  <section class="card step" data-step="1" hidden>
    <h2 data-i18n="shades.title"></h2>
    <p class="muted" data-i18n="shades.intro"></p>
    <div class="callout" data-i18n-html="shades.progHelp"></div>
    <table>
      <thead><tr><th>#</th><th data-i18n="shades.col.name"></th><th data-i18n="shades.col.address"></th><th data-i18n="shades.col.rolling"></th><th data-i18n="shades.col.on"></th><th data-i18n="shades.col.motor"></th></tr></thead>
      <tbody id="manageBody"></tbody>
    </table>
    <div class="bar"><button id="refresh" class="btn small" data-i18n="shades.reload"></button></div>
    <details class="adv">
      <summary data-i18n="radio.title"></summary>
      <label class="advrow"><span data-i18n="radio.freq"></span>
        <input id="radioFreq" type="number" step="0.01" min="433.05" max="434.79">
      </label>
      <p class="muted" data-i18n="radio.help"></p>
    </details>
  </section>

  <!-- Step 2 — Matter -->
  <section class="card step" data-step="2" hidden>
    <h2 data-i18n="matter.title"></h2>
    <p class="muted" data-i18n="matter.intro"></p>
    <div class="callout" data-i18n="matter.help"></div>
    <div class="bar"><button id="pairBtn" class="btn primary" data-i18n="matter.getCode"></button></div>
    <div id="paircode" class="paircode" hidden></div>
    <img id="qrimg" class="qrimg" alt="" hidden>
    <div id="qrpayload" class="qr"></div>
  </section>

  <!-- Step 3 — Backup -->
  <section class="card step" data-step="3" hidden>
    <h2 data-i18n="backup.title"></h2>
    <p class="muted" data-i18n="backup.intro"></p>
    <div class="bar">
      <button id="export" class="btn primary" data-i18n="backup.download"></button>
      <button id="import" class="btn" data-i18n="backup.import"></button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="callout" data-i18n="backup.done"></div>
    <div class="bar"><button id="resetBtn" class="btn danger small" data-i18n="backup.reset"></button></div>
  </section>

  <div class="wiznav">
    <button id="back" class="btn ghost" hidden data-i18n="nav.back"></button>
    <button id="next" class="btn primary" data-i18n="nav.next"></button>
  </div>

  <details class="log-wrap">
    <summary data-i18n="log.title"></summary>
    <div id="log"></div>
  </details>
</main>

<script src="./vendor/qrcode.js"></script>
<script type="module" src="./vendor/esp-web-tools.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
