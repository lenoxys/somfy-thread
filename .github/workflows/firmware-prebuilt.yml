# SPDX-License-Identifier: Unlicense
# Experimental firmware build using Espressif's prebuilt esp-matter image
# (esp-idf + esp-matter already installed) instead of cloning and bootstrapping
# esp-matter from source. Dispatch-only, for comparing build time against
# firmware.yml. If it wins, fold the container into firmware.yml and delete this.
name: firmware-prebuilt

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/esp-matter:release-v1.4_idf_v5.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          VER="${{ github.event.release.tag_name }}"
          [ -n "$VER" ] && echo "$VER" > version.txt || VER=dev
          BIN="somfy-thread-esp32c6-$VER.bin"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          idf.py set-target esp32c6
          idf.py build
          cd build
          esptool.py --chip esp32c6 merge_bin -o "$GITHUB_WORKSPACE/$BIN" @flash_args

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ env.BIN }}

      - name: Attach firmware to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          url="${UPLOAD_URL%%\{*}?name=$BIN"
          curl -fsSL -X POST "$url" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$GITHUB_WORKSPACE/$BIN"
