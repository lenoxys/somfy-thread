# SPDX-License-Identifier: Unlicense
# Deploy the static install/config site to GitHub Pages. The deploy vendors the
# esptool-js bundle and mirrors each release's firmware .bin under fw/<tag>/
# so the flasher fetches it same-origin (GitHub's release-download URL redirects
# to a signed host with no CORS headers, so a browser fetch of it is blocked).
# Re-runs on release publish so new firmware lands on the site.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendor JS deps
        run: sh web/vendor/fetch.sh
      - name: Mirror release firmware
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p web/fw
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            mkdir -p "web/fw/$tag"
            gh release download "$tag" -p '*.bin' -D "web/fw/$tag" --clobber || true
          done
      - name: Stamp site version
        run: echo "${GITHUB_SHA::7}" > web/version.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
