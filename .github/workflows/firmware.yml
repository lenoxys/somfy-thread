# SPDX-License-Identifier: Unlicense
# Build the ESP32-C6 firmware, attest its provenance (SLSA/Sigstore), and publish
# a GitHub Release with the merged firmware.bin (flashable at offset 0) attached.
#
# Triggered by pushing an annotated tag (git tag -a vX.Y.Z -F notes; git push --tags):
# the tag name becomes the firmware version (via version.txt) and the tag message
# becomes the release notes. The bin is attached while the release is still a DRAFT,
# then the release is published last — release immutability freezes a published
# release's assets, so the asset must be in place before publish. Publishing emits
# the release:published event that triggers pages.yml to mirror the new bin, by
# which point the asset already exists. workflow_dispatch runs a test build only
# (builds + attests, publishes nothing).
#
# Uses Espressif's prebuilt esp-matter image (esp-idf + esp-matter already
# installed) so there's no clone/bootstrap. Bump the image tag when upgrading;
# the env paths (IDF_PATH, ESP_MATTER_PATH) are baked into the image.
name: firmware

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/esp-matter:release-v1.4_idf_v5.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          case "$GITHUB_REF" in
            refs/tags/*) VER="$GITHUB_REF_NAME" ;;
            *) VER=dev ;;
          esac
          echo "$VER" > version.txt
          BIN="somfy-thread-esp32c6-$VER.bin"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          idf.py set-target esp32c6
          idf.py build
          cd build
          esptool.py --chip esp32c6 merge_bin -o "$GITHUB_WORKSPACE/$BIN" @flash_args

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ env.BIN }}

      - name: Publish release with firmware
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release create "$TAG" --draft --title "$TAG" --notes-from-tag \
            --repo "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE/$BIN"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
