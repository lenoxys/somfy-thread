# SPDX-License-Identifier: Unlicense
# Build the ESP32-C6 firmware, attest its provenance (SLSA/Sigstore), and attach
# the merged firmware.bin (flashable at offset 0 by ESP Web Tools) to the GitHub
# Release when it is published. workflow_dispatch runs a manual test build (it
# builds and attests but attaches nothing, since there's no release to attach to).
#
# Uses Espressif's prebuilt esp-matter image (esp-idf + esp-matter already
# installed) so there's no clone/bootstrap. Bump the image tag when upgrading;
# the env paths (IDF_PATH, ESP_MATTER_PATH) are baked into the image.
name: firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/esp-matter:release-v1.4_idf_v5.4.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          VER="${{ github.event.release.tag_name }}"
          [ -n "$VER" ] && echo "$VER" > version.txt || VER=dev
          BIN="somfy-thread-esp32c6-$VER.bin"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          idf.py set-target esp32c6
          idf.py build
          cd build
          esptool.py --chip esp32c6 merge_bin -o "$GITHUB_WORKSPACE/$BIN" @flash_args

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ env.BIN }}

      - name: Attach firmware to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          url="${UPLOAD_URL%%\{*}?name=$BIN"
          curl -fsSL -X POST "$url" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$GITHUB_WORKSPACE/$BIN"
