# SPDX-License-Identifier: Unlicense
# Build the ESP32-C6 firmware, attest its provenance (SLSA/Sigstore), and attach
# the merged firmware.bin (flashable at offset 0 by ESP Web Tools) to the GitHub
# Release when it is published. workflow_dispatch runs a manual test build (it
# builds and attests but attaches nothing, since there's no release to attach to).
#
# ponytail: building esp-matter from source is the slow/fragile step (submodule
# checkout + bootstrap, tens of minutes). Pinned to a release branch; bump ESP_MATTER_REF
# and IDF image together when upgrading. If a prebuilt esp-matter image becomes
# available, swap the clone/install steps for `container:`.
name: firmware

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ESP_MATTER_REF: release/v1.4
  IDF_IMAGE: espressif/idf:v5.4

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: somfy-thread
          persist-credentials: false

      - name: Cache esp-matter
        id: cache-matter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: esp-matter
          key: esp-matter-${{ env.ESP_MATTER_REF }}

      - name: Clone & bootstrap esp-matter
        if: steps.cache-matter.outputs.cache-hit != 'true'
        shell: bash
        run: |
          apt-get update && apt-get install -y python3-dev
          . $IDF_PATH/export.sh
          git clone --depth 1 -b "$ESP_MATTER_REF" --recursive \
            https://github.com/espressif/esp-matter.git
          cd esp-matter && ./install.sh

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          export ESP_MATTER_PATH="$GITHUB_WORKSPACE/esp-matter"
          . "$ESP_MATTER_PATH/export.sh"
          cd somfy-thread
          VER="${{ github.event.release.tag_name }}"
          [ -n "$VER" ] && echo "$VER" > version.txt || VER=dev
          BIN="somfy-thread-esp32c6-$VER.bin"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          idf.py set-target esp32c6
          idf.py build
          cd build
          esptool.py --chip esp32c6 merge_bin -o "$GITHUB_WORKSPACE/$BIN" @flash_args

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/${{ env.BIN }}

      - name: Attach firmware to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          url="${UPLOAD_URL%%\{*}?name=$BIN"
          curl -fsSL -X POST "$url" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @"$GITHUB_WORKSPACE/$BIN"
